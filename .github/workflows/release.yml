name: Release

# Build the distribution archives of fhl and attach them to a release page, in one of two ways:
#   - push a tag vX.Y.Z: the release is made for that tag;
#   - run this workflow by hand on main (Actions → Release → Run workflow, or the API) with a version
#     vX.Y.Z: the release and its tag are made here, on the commit the run started from.
# A tag made by this workflow (with GITHUB_TOKEN) does not start another run, so a release is not made twice.
# The archives are built by scripts/release.sh (CI also runs it with the version set to dev to check that it works).
# When run by hand, notes (Markdown) can be given: they go above the generated list of changes on the release page.
# At the end it starts the Pages workflow on main, which rebuilds the site and the demo with the new version.
# (A release made with GITHUB_TOKEN starts no other workflow by itself; workflow_dispatch is the exception.)
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, vX.Y.Z (the tag is made on main)'
        required: true
        type: string
      notes:
        description: 'Notes (Markdown) put above the generated list of changes; may be empty'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  actions: write # to start the Pages workflow after the release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # The version comes from the input or the tag; it is passed through the environment, never pasted into a script.
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
      # The notes, like the version, are passed through the environment, never pasted into a script.
      NOTES: ${{ github.event_name == 'workflow_dispatch' && inputs.notes || '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Check the version (run by hand)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Run this workflow on main (it ran on $GITHUB_REF)." >&2; exit 1
          fi
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The version must look like v1.2.3 (got \"$VERSION\")." >&2; exit 1
          fi
          if [ -n "$(git ls-remote --tags origin "refs/tags/$VERSION")" ]; then
            echo "The tag $VERSION already exists; choose another version." >&2; exit 1
          fi
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: vet and test
        run: |
          go vet ./...
          go test -race -count=1 ./...
      - name: Known vulnerabilities (govulncheck, as in vuln.yml)
        # Built and run with the Go that builds the release (go.mod's toolchain line). With a Go older than 1.26,
        # govulncheck cannot be built, and the release stops here too.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Build the archives
        run: scripts/release.sh "$VERSION" dist
      - name: Attach to the release page
        run: |
          # gh puts the notes given with --notes above the generated list of changes.
          notes=()
          if [ -n "$NOTES" ]; then
            notes=(--notes "$NOTES")
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # Makes the tag on the commit this run checked out.
            gh release create "$VERSION" dist/* --title "$VERSION" --generate-notes "${notes[@]}" --target "$GITHUB_SHA"
          else
            gh release create "$VERSION" dist/* --title "$VERSION" --generate-notes --verify-tag
          fi
      - name: Publish the site with this release
        run: gh workflow run pages.yml --ref main
