name: Pages

# Build the documentation site with website/build.sh (fhl --static-site) and publish it on GitHub Pages,
# every time main changes, or by hand (Actions → Pages → Run workflow).
# The repository's Pages settings must use "GitHub Actions" as the source (Settings → Pages → Build and deployment).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Publish one site at a time; a newer push replaces a waiting one, but a running deployment is not cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build the site
        run: website/build.sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
