name: Pages

# Build the documentation site with website/build.sh (fhl --static-site) and publish it on GitHub Pages.
# It runs when a release is made: the Release workflow starts it on main at the end, so the pages, the demo's
# WebAssembly and the version on the demo all match the new release. Changes merged between releases are
# published with the next release. It can also be run by hand (Actions → Pages → Run workflow).
# The repository's Pages settings must use "GitHub Actions" as the source (Settings → Pages → Build and deployment).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Publish one site at a time; a newer push replaces a waiting one, but a running deployment is not cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The release tags, for the version on the demo, without the history. (checkout's fetch-tags does
      # nothing with its default fetch-depth of 1.)
      - name: Fetch the release tags
        run: git fetch --depth=1 --no-tags origin '+refs/tags/v*:refs/tags/v*'
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build the site
        run: website/build.sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
