name: Pages

# Build the documentation site with website/build.sh (fhl --static-site) and publish it on GitHub Pages,
# when main changes in a file the site is built from, or by hand (Actions → Pages → Run workflow).
# The paths are what build.sh reads: website/, the Go code of fhl (cmd/fhl and the packages it uses, so any
# .go file), go.mod and go.sum, and assets/ (the logo). When build.sh starts reading more files, add them here.
# The repository's Pages settings must use "GitHub Actions" as the source (Settings → Pages → Build and deployment).
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Publish one site at a time; a newer push replaces a waiting one, but a running deployment is not cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the tags, for the version on the demo (git describe)
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build the site
        run: website/build.sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
